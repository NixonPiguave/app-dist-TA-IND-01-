name: ta-ind-01-nixon

services:
  nats1:
    image: nats:2.15.3-alpine
    container_name: nats-nixon-1
    command:
      - "-js"
      - "-sd"
      - "/data"
      - "-m"
      - "8222"
      - "-n"
      - "nats-nixon-1"
      - "--cluster_name"
      - "ta-ind-01-nixon"
      - "--cluster"
      - "nats://0.0.0.0:6222"
      - "--routes"
      - "nats://nats2:6222,nats://nats3:6222"
    ports:
      - "127.0.0.1:4222:4222"
      - "127.0.0.1:8222:8222"
    volumes:
      - nats1-data:/data

  nats2:
    image: nats:2.15.3-alpine
    container_name: nats-nixon-2
    command:
      - "-js"
      - "-sd"
      - "/data"
      - "-m"
      - "8222"
      - "-n"
      - "nats-nixon-2"
      - "--cluster_name"
      - "ta-ind-01-nixon"
      - "--cluster"
      - "nats://0.0.0.0:6222"
      - "--routes"
      - "nats://nats1:6222,nats://nats3:6222"
    ports:
      - "127.0.0.1:4223:4222"
      - "127.0.0.1:8223:8222"
    volumes:
      - nats2-data:/data

  nats3:
    image: nats:2.15.3-alpine
    container_name: nats-nixon-3
    command:
      - "-js"
      - "-sd"
      - "/data"
      - "-m"
      - "8222"
      - "-n"
      - "nats-nixon-3"
      - "--cluster_name"
      - "ta-ind-01-nixon"
      - "--cluster"
      - "nats://0.0.0.0:6222"
      - "--routes"
      - "nats://nats1:6222,nats://nats2:6222"
    ports:
      - "127.0.0.1:4224:4222"
      - "127.0.0.1:8224:8222"
    volumes:
      - nats3-data:/data

volumes:
  nats1-data:
  nats2-data:
  nats3-data:
