name: ta-ind-01-nixon

services:
  nats1:
    image: nats:2.15.3-alpine
    container_name: nats-nixon-1
    command: ["-js", "-sd", "/data", "-m", "8222", "-n", "nats-nixon-1"]
    ports:
      - "127.0.0.1:4222:4222"
      - "127.0.0.1:8222:8222"
    volumes:
      - nats1-data:/data

volumes:
  nats1-data: